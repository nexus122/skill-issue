<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
<style>
  @keyframes jitter {
    0%, 100% { transform: translate(0, 0); }
    25%       { transform: translate(-1px, 0); }
    50%       { transform: translate(0, -2px); }
    75%       { transform: translate(1px, 0); }
  }

  @keyframes eye-pulse {
    0%, 100% { fill: #ff2a2a; }
    50%       { fill: #ff6a6a; }
  }

  @keyframes light-pulse {
    0%, 100% { fill: #cc0000; }
    50%       { fill: #ff4444; }
  }

  .body  { animation: jitter 0.6s ease-in-out infinite; }
  .eye   { animation: eye-pulse 0.8s ease-in-out infinite; }
  .light { animation: light-pulse 0.8s ease-in-out infinite; }
</style>

<!--
  Pixel art robot mascot — alert/angry state  ·  16x16 grid  ·  pixel = 7 units  ·  offset (1,1)
  Same chassis as mascot-idle.svg — only the screen interior (rows 4-6) and the
  animations differ (quicker jitter instead of float, pulsing red instead of calm blink).
-->
<g class="body">

  <!-- row 0 (y=1)   head top ── -->
  <rect x="29" y="1"  width="56" height="7" fill="#9aa8b3"/>

  <!-- row 1 (y=8)   head wider ── -->
  <rect x="22" y="8"  width="70" height="7" fill="#9aa8b3"/>

  <!-- row 2 (y=15)  forehead ── -->
  <rect x="22" y="15" width="70" height="7" fill="#9aa8b3"/>

  <!-- row 3 (y=22)  ears + screen frame top ── -->
  <rect x="15" y="22" width="7"  height="7" fill="#cc0000"/>
  <rect x="22" y="22" width="14" height="7" fill="#9aa8b3"/>
  <rect x="36" y="22" width="42" height="7" fill="#111111"/>
  <rect x="78" y="22" width="14" height="7" fill="#9aa8b3"/>
  <rect x="92" y="22" width="7"  height="7" fill="#cc0000"/>

  <!-- row 4 (y=29)  ears + screen bg + furrowed brows ── -->
  <rect x="15" y="29" width="7"  height="7" fill="#cc0000"/>
  <rect x="22" y="29" width="14" height="7" fill="#9aa8b3"/>
  <rect x="36" y="29" width="7"  height="7" fill="#2a0505"/>
  <rect x="43" y="29" width="7"  height="7" fill="#111111"/>
  <rect x="50" y="29" width="14" height="7" fill="#2a0505"/>
  <rect x="64" y="29" width="7"  height="7" fill="#111111"/>
  <rect x="71" y="29" width="7"  height="7" fill="#2a0505"/>
  <rect x="78" y="29" width="14" height="7" fill="#9aa8b3"/>
  <rect x="92" y="29" width="7"  height="7" fill="#cc0000"/>

  <!-- row 5 (y=36)  ears + angry eyes ── -->
  <rect x="15" y="36" width="7"  height="7" fill="#cc0000"/>
  <rect x="22" y="36" width="14" height="7" fill="#9aa8b3"/>
  <rect x="36" y="36" width="7"  height="7" fill="#2a0505"/>
  <rect x="43" y="36" width="7"  height="7" class="eye" fill="#ff2a2a"/>
  <rect x="50" y="36" width="14" height="7" fill="#2a0505"/>
  <rect x="64" y="36" width="7"  height="7" class="eye" fill="#ff2a2a"/>
  <rect x="71" y="36" width="7"  height="7" fill="#2a0505"/>
  <rect x="78" y="36" width="14" height="7" fill="#9aa8b3"/>
  <rect x="92" y="36" width="7"  height="7" fill="#cc0000"/>

  <!-- row 6 (y=43)  ears + screen bg ── -->
  <rect x="15" y="43" width="7"  height="7" fill="#cc0000"/>
  <rect x="22" y="43" width="14" height="7" fill="#9aa8b3"/>
  <rect x="36" y="43" width="42" height="7" fill="#2a0505"/>
  <rect x="78" y="43" width="14" height="7" fill="#9aa8b3"/>
  <rect x="92" y="43" width="7"  height="7" fill="#cc0000"/>

  <!-- row 7 (y=50)  screen frame bottom ── -->
  <rect x="22" y="50" width="14" height="7" fill="#9aa8b3"/>
  <rect x="36" y="50" width="42" height="7" fill="#111111"/>
  <rect x="78" y="50" width="14" height="7" fill="#9aa8b3"/>

  <!-- row 8 (y=57)  shoulders ── -->
  <rect x="15" y="57" width="7"  height="7" fill="#4a5058"/>
  <rect x="22" y="57" width="70" height="7" fill="#9aa8b3"/>
  <rect x="92" y="57" width="7"  height="7" fill="#4a5058"/>

  <!-- row 9 (y=64)  chassis + status light ── -->
  <rect x="15" y="64" width="7"  height="7" fill="#4a5058"/>
  <rect x="22" y="64" width="28" height="7" fill="#9aa8b3"/>
  <rect x="50" y="64" width="14" height="7" class="light" fill="#cc0000"/>
  <rect x="64" y="64" width="28" height="7" fill="#9aa8b3"/>
  <rect x="92" y="64" width="7"  height="7" fill="#4a5058"/>

  <!-- row 10 (y=71) chassis lower ── -->
  <rect x="15" y="71" width="7"  height="7" fill="#4a5058"/>
  <rect x="22" y="71" width="70" height="7" fill="#9aa8b3"/>
  <rect x="92" y="71" width="7"  height="7" fill="#4a5058"/>

  <!-- row 11 (y=78) wheels top ── -->
  <rect x="15" y="78" width="7"  height="7" fill="#cc0000"/>
  <rect x="22" y="78" width="70" height="7" fill="#4a5058"/>
  <rect x="92" y="78" width="7"  height="7" fill="#cc0000"/>

  <!-- row 12 (y=85) wheels bottom ── -->
  <rect x="15" y="85" width="7"  height="7" fill="#cc0000"/>
  <rect x="22" y="85" width="70" height="7" fill="#4a5058"/>
  <rect x="92" y="85" width="7"  height="7" fill="#cc0000"/>

  <!-- row 13 (y=92) ground shadow ── -->
  <rect x="29" y="92" width="56" height="7" fill="#4a5058"/>

</g>
</svg>
