<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
<style>
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-3px); }
  }

  /* Single keyframe handles both glow cycle and blink */
  @keyframes eye-r {
    0%   { fill: #cc0000; }
    35%  { fill: #7a0000; }
    70%  { fill: #cc0000; }
    84%  { fill: #cc0000; }
    86%  { fill: #111111; }
    91%  { fill: #111111; }
    93%  { fill: #cc0000; }
    100% { fill: #cc0000; }
  }

  @keyframes eye-h {
    0%   { fill: #ff4444; }
    35%  { fill: #992222; }
    70%  { fill: #ff4444; }
    84%  { fill: #ff4444; }
    86%  { fill: #111111; }
    91%  { fill: #111111; }
    93%  { fill: #ff4444; }
    100% { fill: #ff4444; }
  }

  @keyframes badge {
    0%, 60%, 100% { fill: #ffd700; }
    65%            { fill: #fff4a0; }
    70%            { fill: #ffd700; }
  }

  .body  { animation: float 3s ease-in-out infinite; }
  .eye-r { animation: eye-r 5s ease-in-out infinite; }
  .eye-h { animation: eye-h 5s ease-in-out infinite; }
  .badge { animation: badge 4s ease-in-out infinite; }
</style>

<!--
  Pixel art skull  ·  14×14 grid  ·  pixel = 7 units  ·  offset (1,1)
  x(col) = 1 + col*7    y(row) = 1 + row*7
-->
<g class="body">

  <!-- ── row 0 (y=1)  beret top ── -->
  <rect x="22" y="1"  width="56" height="7" fill="#5a7a32"/>

  <!-- ── row 1 (y=8)  beret wider ── -->
  <rect x="15" y="8"  width="70" height="7" fill="#5a7a32"/>

  <!-- ── row 2 (y=15)  beret + badge ── -->
  <rect x="8"  y="15" width="14" height="7" fill="#5a7a32"/>
  <rect x="22" y="15" width="7"  height="7" class="badge" fill="#ffd700"/>
  <rect x="29" y="15" width="63" height="7" fill="#5a7a32"/>

  <!-- ── row 3 (y=22)  beret brim ── -->
  <rect x="1"  y="22" width="98" height="7" fill="#2d3d15"/>

  <!-- ── row 4 (y=29)  skull top ── -->
  <rect x="22" y="29" width="56" height="7" fill="#f0ede0"/>

  <!-- ── row 5 (y=36)  skull upper ── -->
  <rect x="15" y="36" width="70" height="7" fill="#f0ede0"/>

  <!-- ── row 6 (y=43)  skull wide ── -->
  <rect x="8"  y="43" width="77" height="7" fill="#f0ede0"/>
  <rect x="85" y="43" width="7"  height="7" fill="#c8c4b0"/>

  <!-- ── row 7 (y=50)  eye sockets top ── -->
  <rect x="8"  y="50" width="7"  height="7" fill="#f0ede0"/>
  <rect x="15" y="50" width="21" height="7" fill="#111111"/>
  <rect x="36" y="50" width="21" height="7" fill="#f0ede0"/>
  <rect x="57" y="50" width="21" height="7" fill="#111111"/>
  <rect x="78" y="50" width="7"  height="7" fill="#f0ede0"/>
  <rect x="85" y="50" width="7"  height="7" fill="#c8c4b0"/>

  <!-- ── row 8 (y=57)  red eyes ── -->
  <rect x="8"  y="57" width="7"  height="7" fill="#f0ede0"/>
  <rect x="15" y="57" width="7"  height="7" fill="#111111"/>
  <rect x="22" y="57" width="7"  height="7" class="eye-h" fill="#ff4444"/>
  <rect x="29" y="57" width="7"  height="7" class="eye-r" fill="#cc0000"/>
  <rect x="36" y="57" width="21" height="7" fill="#f0ede0"/>
  <rect x="57" y="57" width="7"  height="7" fill="#111111"/>
  <rect x="64" y="57" width="7"  height="7" class="eye-h" fill="#ff4444"/>
  <rect x="71" y="57" width="7"  height="7" class="eye-r" fill="#cc0000"/>
  <rect x="78" y="57" width="7"  height="7" fill="#f0ede0"/>
  <rect x="85" y="57" width="7"  height="7" fill="#c8c4b0"/>

  <!-- ── row 9 (y=64)  eye sockets bottom ── -->
  <rect x="8"  y="64" width="7"  height="7" fill="#f0ede0"/>
  <rect x="15" y="64" width="21" height="7" fill="#111111"/>
  <rect x="36" y="64" width="21" height="7" fill="#f0ede0"/>
  <rect x="57" y="64" width="21" height="7" fill="#111111"/>
  <rect x="78" y="64" width="7"  height="7" fill="#f0ede0"/>
  <rect x="85" y="64" width="7"  height="7" fill="#c8c4b0"/>

  <!-- ── row 10 (y=71)  nose holes ── -->
  <rect x="15" y="71" width="21" height="7" fill="#f0ede0"/>
  <rect x="36" y="71" width="7"  height="7" fill="#111111"/>
  <rect x="50" y="71" width="7"  height="7" fill="#111111"/>
  <rect x="57" y="71" width="21" height="7" fill="#f0ede0"/>

  <!-- ── row 11 (y=78)  gum + teeth ── -->
  <rect x="22" y="78" width="7"  height="7" fill="#f0ede0"/>
  <rect x="29" y="78" width="7"  height="7" fill="#ffffff"/>
  <rect x="36" y="78" width="7"  height="7" fill="#f0ede0"/>
  <rect x="43" y="78" width="7"  height="7" fill="#ffffff"/>
  <rect x="50" y="78" width="7"  height="7" fill="#f0ede0"/>
  <rect x="57" y="78" width="7"  height="7" fill="#ffffff"/>
  <rect x="64" y="78" width="7"  height="7" fill="#f0ede0"/>
  <rect x="71" y="78" width="7"  height="7" fill="#ffffff"/>
  <rect x="78" y="78" width="7"  height="7" fill="#f0ede0"/>

  <!-- ── row 12 (y=85)  teeth bottom ── -->
  <rect x="29" y="85" width="7"  height="7" fill="#ffffff"/>
  <rect x="43" y="85" width="7"  height="7" fill="#ffffff"/>
  <rect x="57" y="85" width="7"  height="7" fill="#ffffff"/>
  <rect x="71" y="85" width="7"  height="7" fill="#ffffff"/>

</g>
</svg>
